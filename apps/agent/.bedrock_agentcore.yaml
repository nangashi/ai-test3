default_agent: main
agents:
  main:
    name: main
    entrypoint: src/main.py
    platform: linux/arm64
    container_runtime: docker
    aws:
      execution_role: arn:aws:iam::384081048358:role/bedrock-agent-role
      execution_role_auto_create: true
      account: '384081048358'
      region: ap-northeast-1
      ecr_repository: 384081048358.dkr.ecr.ap-northeast-1.amazonaws.com/bedrock-agent
      ecr_auto_create: false
      network_configuration:
        network_mode: PUBLIC
      protocol_configuration:
        server_protocol: HTTP
      observability:
        enabled: true
    bedrock_agentcore:
      agent_id: null
      agent_arn: null
      agent_session_id: null
    codebuild:
      project_name: null
      execution_role: null
      source_bucket: null
    authorizer_configuration: null
    oauth_configuration: null
