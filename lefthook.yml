colors: false

pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: gitleaks git --staged --verbose --exit-code=1 --redact --no-banner --no-color
    terraform:
      run: terraform fmt -no-color {staged_files}
      glob: "*.tf"
      stage_fixed: true
    prettier:
      run: prettier --write {staged_files}
      glob: "**/*.{json,md,yaml,yml}"
      stage_fixed: true
