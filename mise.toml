[tools]
# Python関連
uv = "0.8.2"
ruff = "0.11.13"
# AWS関連
awscli = "2.22.34"
# Terraform関連
terraform = "1.12.2"
tflint = "0.58.0"
# セキュリティ関連
trivy = "0.63.0"
gitleaks = "8.28.0"
# その他ツール
"aqua:fujiwara/lambroll" = "1.1.0"
lefthook = "1.12.2"
prettier = "3.6.2"
fd = "latest"
markdownlint-cli2 = "latest"

# デプロイツール
[tasks."tf:plan"]
description = "terraform plan"
run = "cd terraform/ && terraform plan"

[tasks."tf:apply"]
description = "terraform apply"
run = "cd terraform/ && terraform apply -auto-approve"

[tasks."agentcore:launch"]
description = "agentcore launch"
run = "cd apps/agent/ && uv run agentcore launch --codebuild"

# チェックツール
[tasks.check]
description = "チェックツール実行"
depends = ["check:secrets"]

[tasks."check:secrets"]
description = "機密情報をチェック"
run = "gitleaks detect"

[tasks."check:markdown"]
description = "markdown"
run = 'prettier --check "**/*.md"'
